name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://say_ai:say_ai_ci@127.0.0.1:5432/say_ai_test
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: say_ai
          POSTGRES_PASSWORD: say_ai_ci
          POSTGRES_DB: say_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U say_ai -d say_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Migrate test database
        run: npm run db:migrate
      - name: Run deterministic tests
        run: npm test
